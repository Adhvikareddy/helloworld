# Q-SENTINEL v9 Docker Compose — Track B: Network-Isolated Testbed
#
# 4-Network Topology:
#   qsentinel_kv     — Key material distribution (Alice → Verifiers only)
#   qsentinel_api    — API verification network (API ↔ Dashboard, Attacker)
#   qsentinel_ledger — Evidence ledger (API → Ledger only)
#   qsentinel_mgmt   — Management/monitoring (Dashboard, operator access)
#
# Services:
#   qsentinel-api       — FastAPI backend (L1/L2/L3/L4)
#   qsentinel-dashboard — Streamlit Judge Mode UI
#   qsentinel-attacker  — Adversarial test client (mallory credential)
#
# USP: Network isolation ensures the attacker cannot directly access
# the keyvault or ledger services, matching the adversary model in §3.1.

networks:
  qsentinel_kv:
    driver: bridge
    internal: true  # No external access
  qsentinel_api:
    driver: bridge
  qsentinel_ledger:
    driver: bridge
    internal: true  # No external access
  qsentinel_mgmt:
    driver: bridge

volumes: {}

services:

  # ──────────────────────────────────────────────────────────────
  # Q-SENTINEL API — FastAPI hosting L3 → L1 → L2 → L4
  # Connects to: kv (read keys), api (serve requests), ledger (write evidence)
  # ──────────────────────────────────────────────────────────────
  qsentinel-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - QSENTINEL_LEDGER_SECRET=${QSENTINEL_LEDGER_SECRET:-change_me_in_production}
      - QSENTINEL_DB_PATH=/app/data/ledger.db
      - QSENTINEL_NONCE_DB=/app/data/nonces.db
    volumes:
      - ./data:/app/data
      - ./apps:/app/apps
      - ./src:/app/src
      - ./attacker:/app/attacker
      - ./experiments:/app/experiments
      - ./attacker/credentials:/app/keys:ro  # Read-only access to key material
    networks:
      - qsentinel_kv
      - qsentinel_api
      - qsentinel_ledger
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    ports:
      - "8000:8000"

  # ──────────────────────────────────────────────────────────────
  # Q-SENTINEL Dashboard — Streamlit Judge Mode
  # Connects to: api (send verification requests), mgmt (expose to operator)
  # ──────────────────────────────────────────────────────────────
  qsentinel-dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      - QSENTINEL_API_URL=http://qsentinel-api:8000
    depends_on:
      qsentinel-api:
        condition: service_healthy
    ports:
      - "8501:8501"
    networks:
      - qsentinel_api
      - qsentinel_mgmt
    deploy:
      resources:
        limits:
          memory: 512M

  # ──────────────────────────────────────────────────────────────
  # Q-SENTINEL Attacker — Adversarial test client
  # Connects to: api ONLY — cannot reach keyvault or ledger directly
  # This enforces the adversary model: mallory can submit API requests
  # but cannot access key material or tamper with the ledger directly.
  # ──────────────────────────────────────────────────────────────
  qsentinel-attacker:
    build:
      context: .
      dockerfile: services/attacker/Dockerfile
    environment:
      - QSENTINEL_API_URL=http://qsentinel-api:8000
      # Attacker does NOT get QSENTINEL_DB_PATH — cannot access ledger
    depends_on:
      qsentinel-api:
        condition: service_healthy
    networks:
      - qsentinel_api
      # NOTE: attacker is NOT on qsentinel_kv or qsentinel_ledger networks
    deploy:
      resources:
        limits:
          memory: 512M
